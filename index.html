<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Wife ❤️</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6e6; /* Soft Pink */
            font-family: 'Arial', sans-serif;
            text-align: center;
        }

        h1 {
            color: #d63384;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .gif_container img {
            width: 200px;
            margin-bottom: 20px;
        }

        .btn-container {
            display: flex;
            gap: 20px;
            position: relative;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }

        #noBtn {
            background-color: #888;
            color: white;
            position: absolute;
            left: 120px; /* Adjust based on Yes button width */
        }
    </style>
</head>
<body>

    <div id="main-content">
        <div class="gif_container">
            <img src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExbGRmbDZ4MmxxY3U1dW96OGw3cXdqb2x2ZTZpd3ZqcXJ3N29odXo3byZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/JSxzmyV7AqeABDQKed/giphy.gif" alt="Cute Bear">
        </div>
        <h1>Shalu❤️ <br> Will you be my Valentine? ❤️</h1>
        <div class="btn-container">
            <button id="yesBtn" onclick="showLove()">Yes</button>
            <button id="noBtn" onmouseover="moveButton()">No</button>
        </div>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            // Calculate random positions
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function showLove() {
            document.getElementById('main-content').innerHTML = `
                <div class="gif_container">
                    <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExMXl3OXI2OXhiY2cwNHN0MHJxbjRqM2o2M3FsZTBpOTBiZ3hsZ3p2MyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Wopg1mZqst26bQYdMK/giphy.gif" alt="Happy Bear">
                </div>
                <h1>Yay! Best Decision Ever 😍 <br> I love you so much! 🥰❤️</h1>
                <p style="color: #d63384; font-size: 1.2rem;">Get ready for our date at 7:00 PM!</p>
            `;
        }
    </script>
</body>
</html>
